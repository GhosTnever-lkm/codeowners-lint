name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"
      - name: Verify version and tests
        run: |
          python -c "import tomllib; from pathlib import Path; import os; version=tomllib.loads(Path('pyproject.toml').read_text())['project']['version']; tag=os.environ['GITHUB_REF_NAME']; assert tag == f'v{version}', f'tag {tag} does not match project version {version}'"
          python -m unittest discover -s tests -t . -v
          python -m codeowners_lint examples/demo --require-full --strict
      - name: Build packages and checksums
        run: |
          python -m pip install build
          python -m build --outdir dist
          git archive --format=zip --prefix="codeowners-lint-${GITHUB_REF_NAME}/" "${GITHUB_REF_NAME}" -o "codeowners-lint-${GITHUB_REF_NAME}.zip"
          sha256sum dist/* "codeowners-lint-${GITHUB_REF_NAME}.zip" > SHA256SUMS
      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" --title "codeowners-lint $GITHUB_REF_NAME" --generate-notes dist/* "codeowners-lint-${GITHUB_REF_NAME}.zip" SHA256SUMS
